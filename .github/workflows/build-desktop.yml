name: Build Desktop Apps

# Chạy tay (Actions -> Run workflow) hoặc push tag vX.Y.Z để tự build + tạo Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Tránh treo trong CI:
# - NX_DAEMON=false: lerna/Nx KHÔNG chạy daemon (daemon hay treo trên runner).
# - COREPACK_ENABLE_DOWNLOAD_PROMPT=0: corepack không hỏi Y/n khi tải yarn.
env:
  NX_DAEMON: "false"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  CI: "true"

jobs:
  # ---------------- CLIENT (Wails/Go) ----------------
  client:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14 # Apple Silicon; client build UNIVERSAL nên chạy cả Intel
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cài deps GTK/WebKit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Add GOPATH/bin to PATH (unix)
        if: runner.os != 'Windows'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Add GOPATH/bin to PATH (windows)
        if: runner.os == 'Windows'
        run: echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build client (Windows x64)
        if: runner.os == 'Windows'
        working-directory: client
        run: wails build -platform windows/amd64 -clean -ldflags "-s -w"
      - name: Build client (macOS universal)
        if: runner.os == 'macOS'
        working-directory: client
        run: wails build -platform darwin/universal -clean -ldflags "-s -w"
      - name: Build client (Linux amd64)
        if: runner.os == 'Linux'
        working-directory: client
        run: wails build -platform linux/amd64 -tags webkit2_41 -clean -ldflags "-s -w"
      - name: Zip macOS .app
        if: runner.os == 'macOS'
        working-directory: client/build/bin
        run: |
          for app in *.app; do ditto -c -k --sequesterRsrc --keepParent "$app" "../../../client-${app%.app}-macos-universal.zip"; done
      - name: Đóng gói binary Linux
        if: runner.os == 'Linux'
        working-directory: client/build/bin
        run: tar -czf ../../../client-linux-amd64.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.name }}
          path: |
            client/build/bin/*.exe
            client-*-macos-universal.zip
            client-linux-amd64.tar.gz
          if-no-files-found: warn

  # ---------------- RIKKEI IDE — Windows ----------------
  ide-windows:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bật long paths
        run: git config --system core.longpaths true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: theia-ide/yarn.lock
      - run: corepack enable
      - name: Cache plugins + JRE + Python
        uses: actions/cache@v4
        with:
          path: |
            theia-ide/plugins
            theia-ide/applications/electron/resources/java
            theia-ide/applications/electron/resources/python
          key: theia-runtime-windows-${{ hashFiles('theia-ide/package.json') }}
      - name: yarn install
        working-directory: theia-ide
        # --ignore-optional: bỏ native optional (vd cpu-features) cần Visual Studio
        # để build — Theia không cần, tránh fail node-gyp trên runner Windows.
        run: yarn install --network-timeout 600000 --ignore-optional
      - name: download plugins/python/java
        working-directory: theia-ide
        run: |
          yarn download:plugins
          yarn download:python
          yarn download:java
      - name: build:extensions
        working-directory: theia-ide
        run: yarn build:extensions
      - name: theia build
        working-directory: theia-ide/applications/electron
        run: npx theia build --app-target=electron
      - name: electron-builder (win)
        working-directory: theia-ide/applications/electron
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ide-windows
          path: |
            theia-ide/applications/electron/dist/*.exe
            theia-ide/applications/electron/dist/*.zip
          if-no-files-found: warn

  # ---------------- RIKKEI IDE — macOS (arm64 + Intel) ----------------
  ide-macos:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: arm64
            ebArgs: "--mac --arm64"
          - os: macos-13
            name: intel
            ebArgs: "--mac --x64"
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: theia-ide/yarn.lock
      - run: corepack enable
      - name: Cache plugins + JRE + Python
        uses: actions/cache@v4
        with:
          path: |
            theia-ide/plugins
            theia-ide/applications/electron/resources/java
            theia-ide/applications/electron/resources/python
          key: theia-runtime-macos-${{ matrix.name }}-${{ hashFiles('theia-ide/package.json') }}
      - name: yarn install
        working-directory: theia-ide
        run: yarn install --network-timeout 600000
      - name: download plugins/python/java
        working-directory: theia-ide
        run: |
          yarn download:plugins
          yarn download:python
          yarn download:java
      - name: build:extensions
        working-directory: theia-ide
        run: yarn build:extensions
      - name: theia build
        working-directory: theia-ide/applications/electron
        run: npx theia build --app-target=electron
      - name: electron-builder (mac)
        working-directory: theia-ide/applications/electron
        run: npx electron-builder ${{ matrix.ebArgs }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ide-macos-${{ matrix.name }}
          path: |
            theia-ide/applications/electron/dist/*.dmg
          if-no-files-found: warn

  # ---------------- RIKKEI IDE — Linux (AppImage + deb) ----------------
  ide-linux:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài libfuse2 (AppImage)
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: theia-ide/yarn.lock
      - run: corepack enable
      - name: Cache plugins + JRE + Python
        uses: actions/cache@v4
        with:
          path: |
            theia-ide/plugins
            theia-ide/applications/electron/resources/java
            theia-ide/applications/electron/resources/python
          key: theia-runtime-linux-${{ hashFiles('theia-ide/package.json') }}
      - name: yarn install
        working-directory: theia-ide
        run: yarn install --network-timeout 600000
      - name: download plugins/python/java
        working-directory: theia-ide
        run: |
          yarn download:plugins
          yarn download:python
          yarn download:java
      - name: build:extensions
        working-directory: theia-ide
        run: yarn build:extensions
      - name: theia build
        working-directory: theia-ide/applications/electron
        run: npx theia build --app-target=electron
      - name: electron-builder (linux)
        working-directory: theia-ide/applications/electron
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ide-linux
          path: |
            theia-ide/applications/electron/dist/*.AppImage
            theia-ide/applications/electron/dist/*.deb
          if-no-files-found: warn

  # ---------------- RELEASE (chỉ khi push tag vX.Y.Z) ----------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client, ide-windows, ide-macos, ide-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gộp file
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
